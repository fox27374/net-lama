name: Build agent packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the packages to the release on a tag

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # git describe needs the tags for the package version

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build .deb and .rpm
      run: make pkg

    - name: Upload as workflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: netlama-agent-packages
        path: dist/*

    - name: Attach to the release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
